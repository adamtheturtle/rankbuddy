# Periphery configuration — advisory dead-code detection.
#
# Periphery finds unused Swift code (types, functions, properties, enum cases,
# protocol conformances) across the whole project, catching symbols orphaned
# across split-out extension files (Type+Feature.swift) that SwiftLint's
# per-file analysis can't see.
#
# Run locally with:  periphery scan
# It is wired into CI as a NON-BLOCKING job (see .github/workflows/ci.yml) so a
# noisy report never reds the build — promote it to blocking once it's proven
# clean. Periphery builds a full index, so it's slower than the lint gate.

project: rankbuddy-macos.xcodeproj

# Build the app scheme. It builds the test targets too, so a symbol referenced
# only from a test still counts as used and isn't reported as dead.
schemes:
  - rankbuddy-macos

# A duplicated autogenerated scheme can trip Periphery's scheme validation; skip
# it so the scan runs regardless.
skip_schemes_validation: true

# Findings inside the test targets are noise here — unreferenced @Test methods
# are invoked reflectively by the runner, and unused test helpers aren't product
# dead code. The test sources are still indexed (so test→app references retain
# app symbols); they're just excluded from the report.
report_exclude:
  - "rankbuddy-macosTests/**"
  - "rankbuddy-macosUITests/**"

# --- Retain rules: suppress this app's known false-positive sources ----------

# Retain public declarations so symbols exposed across the app↔extension boundary
# and to the system (App Intents / App Shortcuts are discovered by the OS, not
# referenced in Swift) are not flagged.
retain_public: true

# @objc / dynamic members are reachable from the Objective-C runtime (selectors,
# NSTableView target/action bridges, AppKit menu validation).
retain_objc_accessible: true

# SwiftUI previews (#Preview / PreviewProvider) are entry points the compiler
# keeps but nothing references in Swift.
retain_swift_ui_previews: true

# Codable models decode many fields from the HackerRank REST API that aren't read
# back in Swift; they must stay for the decode to round-trip.
retain_codable_properties: true

# Properties only ever assigned (never read) are often deliberate — @State the UI
# mutates, retained references that keep a delegate/observer alive. Keep them out
# of the report rather than churning UI code chasing false positives.
retain_assign_only_properties: true

# Output the unused-symbol report grouped, easy to scan in CI logs.
format: xcode
