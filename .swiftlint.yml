# Analyzer-only rules. These require a compiler log and run under
# `swiftlint analyze`, not plain `swiftlint lint`. The CI lint gate doesn't run
# them, but listing them here documents intent and lets a local `analyze` use them.
analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

# The Xcode-style file header (PadBuddy parity, #80): a blank comment, the file
# name, the target name, a blank comment. `SWIFTLINT_CURRENT_FILENAME` is replaced
# per file; the optional `Tests` matches the test target's files.
file_header:
  required_pattern: |
    \/\/
    \/\/  SWIFTLINT_CURRENT_FILENAME
    \/\/  rankbuddy-macos(Tests)?
    \/\/

# Project-specific gates.
custom_rules:
  # Prevent accidental competitor/old product-name leakage into user-facing strings
  # (#21). PadBuddy is RankBuddy's design north-star, so its name legitimately appears
  # throughout doc-comments and comments; `match_kinds: [string]` restricts this rule
  # to string literals only, so those comments are untouched while a name that would
  # actually ship to a user (a Text, label, alert, accessibility string …) fails the
  # strict lint gate.
  competitor_product_name_in_string:
    name: "Competitor/old product name in a string literal"
    regex: '(?i)(coderpad|padbuddy)'
    match_kinds:
      - string
    message: "Don't ship CoderPad/PadBuddy product names in user-facing strings (#21); use RankBuddy."
    severity: error
