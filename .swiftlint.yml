# SwiftLint configuration.
#
# Strategy: enable (nearly) every opt-in rule on top of the default set, then
# subtract only the rules that (a) duplicate or fight SwiftFormat — which owns
# formatting here — (b) are mutually exclusive with a rule we keep, or (c) are
# counterproductive for an app target. `swiftlint --strict` in CI fails on any
# violation. SwiftFormat owns *formatting*; SwiftLint owns *correctness*.
#
# Intentionally NOT enabled, by reason:
#   formatting (SwiftFormat's job): contrasted_opening_brace, indentation_width,
#     all multiline_*, vertical_whitespace_*, vertical_parameter_alignment_on_call,
#     operator_usage_whitespace, period_spacing, attributes, modifier_order,
#     sorted_imports, number_separator, unneeded_parentheses_in_closure_argument,
#     switch_case_on_newline, closure_spacing, closure_end_indentation,
#     collection_alignment, comma_inheritance, let_var_whitespace,
#     literal_expression_end_indentation, trailing_closure, multiline_function_chains
#   opposite of a kept rule: explicit_self (we keep redundant_self),
#     extension_access_modifier, no_extension_access_modifier, explicit_acl,
#     explicit_top_level_acl
#   counterproductive for an app: explicit_type_interface, no_magic_numbers,
#     missing_docs, required_deinit, explicit_enum_raw_value,
#     conditional_returns_on_newline, discouraged_optional_boolean,
#     discouraged_optional_collection, discouraged_default_parameter,
#     type_contents_order, file_types_order, one_declaration_per_file, file_name,
#     anonymous_argument_in_multiline_closure, prefixed_toplevel_constant,
#     sorted_enum_cases (would break semantically-ordered enums),
#     closure_body_length (fights SwiftUI's large view-body closures, the same
#     idiom the long-body type-check budget already guards), no_grouping_extension
#     (the codebase deliberately organizes types with in-file extensions),
#     no_empty_block (fires on idiomatic empty singletons and SwiftUI dismiss
#     closures), variable_shadowing (fires on the idiomatic `let x = x` value
#     capture and standard closure parameters)
#   tooling mismatch: prefer_nimble, nimble_operator (no Quick/Nimble)
#   conflicts with SwiftFormat: local_doc_comment — SwiftFormat's docComments rule
#     wants `///` on nested function declarations, the opposite of this rule
#   false positive on SwiftUI: unused_parameter — flags the `$binding` projected
#     closure parameter (e.g. WindowGroup(for:) { $url in }) as unused even though
#     its wrapped value is used
#   catch-22: balanced_xctest_lifecycle would require a tearDown to match setUp,
#     but an empty tearDown then trips empty_xctest_method (which we keep)
#   architecture conflict: private_swiftui_state — views are split across
#     Type+Feature.swift files to satisfy file_length, so their @State must be
#     module-internal rather than private.
#
# The analyzer_rules section below holds rules that only take effect under
# `swiftlint analyze` (which needs a compiler log), not plain `lint`. Listing
# them there rather than in opt_in_rules keeps `swiftlint lint` from warning that
# they are misplaced.

included:
  - rankbuddy-macos
  - rankbuddy-macosTests
  - rankbuddy-macosUITests

excluded:
  - build_release    # SPM checkouts / build output
  - DerivedData

opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
