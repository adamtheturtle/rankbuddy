name: Configure buddy-kit access
description: Configure the read-only deploy key used for RankBuddy's private buddy-kit dependency.

inputs:
  ssh-private-key:
    description: Read-only deploy key for adamtheturtle/buddy-kit.
    required: true

runs:
  using: composite
  steps:
    - name: Configure private Swift package access
      shell: bash
      env:
        BUDDY_KIT_DEPLOY_KEY: ${{ inputs.ssh-private-key }}
      run: |
        set -euo pipefail
        key_path="$RUNNER_TEMP/rankbuddy-buddy-kit-deploy-key"
        install -d -m 700 "$HOME/.ssh"
        printf '%s\n' "$BUDDY_KIT_DEPLOY_KEY" > "$key_path"
        chmod 600 "$key_path"
        ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts"
        git config --global core.sshCommand "ssh -i $key_path -o IdentitiesOnly=yes"
        git config --global \
          url."git@github.com:adamtheturtle/buddy-kit.git".insteadOf \
          "https://github.com/adamtheturtle/buddy-kit"
