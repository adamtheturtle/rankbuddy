name: CI

# CI topology (mirrors the sibling PadBuddy repo):
#
# Cheap gates run on every push/PR (and nightly): they catch workflow, shell, and
# Swift style regressions on 1x-billed Linux runners before anything reaches main.
# Pull requests also receive one cancellable Debug compile; the expensive full
# test and Release lanes remain nightly/manual.
#
# The app scheme and test plans exist, so scheduled/manual macOS validation runs
# the Full test plan, a Release build, and an opt-in TSan test lane while retaining
# result artifacts on failure.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC nightly
  # Allow manually kicking off a run from the Actions tab when needed.
  workflow_dispatch:

# Cancel an in-progress run when a newer run starts on the same ref.
# macOS runners bill at 10x minutes, so not paying for superseded builds matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the validation jobs only read the checkout. No job here writes
# to the repo, comments, or publishes, so the token gets read-only contents.
permissions:
  contents: read

jobs:
  # Lint the workflow files themselves: catches invalid syntax, bad expressions,
  # and (via the runner's preinstalled shellcheck) bugs in embedded `run:`
  # scripts. Runs on Linux — cheap, and unrelated to the macOS build.
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        # Pin the release and retry temporary GitHub download failures.
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 5 --retry-delay 2 \
            --connect-timeout 20 --max-time 180 --output actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  # Lint any standalone shell scripts. actionlint only covers shell embedded in
  # workflow `run:` blocks, so scripts under the repo would otherwise go
  # unchecked. shellcheck is preinstalled on the runner; scripts are discovered
  # dynamically so additions automatically join the gate.
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=( **/*.sh )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts to check."
            exit 0
          fi
          printf 'Checking: %s\n' "${files[@]}"
          shellcheck "${files[@]}"

      - name: Test Developer ID profile validation
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  # Swift style gate. Runs on every push/PR (and nightly) so a SwiftLint or
  # SwiftFormat regression is caught before it lands on main. It runs on a 1x
  # Linux runner (see the container note below), so there is no per-push macOS
  # cost. Both tools run as prebuilt binaries at a pinned version so CI matches
  # the local toolchain; bump these in lockstep with any local upgrade and with
  # .swiftlint.yml / .swiftformat.
  swift-lint:
    name: SwiftLint & SwiftFormat
    runs-on: ubuntu-latest
    # The SwiftLint/SwiftFormat Linux binaries dlopen the Swift runtime and
    # sourcekitd at launch; a bare ubuntu-latest runner ships no Swift, so they
    # wouldn't start. The official Swift toolchain image supplies both. 6.4
    # matches the Swift version the app target builds with, so the sourcekit
    # SwiftLint parses with is the same one used locally.
    # The pinned SwiftLint binary needs libxml2.so.2 from Ubuntu 24.04.
    # The floating 6.4 tag now uses Ubuntu 26.04 and cannot load that binary.
    container: swift:6.4-noble
    timeout-minutes: 10
    # Inside a container GitHub runs `run:` steps with `sh` (dash), which rejects
    # the `set -o pipefail` bashism the steps below rely on; the image ships bash,
    # so pin it explicitly.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify iCloud key-value entitlement
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # Xcode entitlement placeholders must remain literal.
          grep -A1 -F '<key>com.apple.developer.ubiquity-kvstore-identifier</key>' \
            rankbuddy-macos/rankbuddy-macos.entitlements \
            | grep -Fq '<string>$(TeamIdentifierPrefix)$(CFBundleIdentifier)</string>'

      # Supply both the fetch tools and SwiftLint's XML runtime explicitly.
      - name: Install fetch tools and lint runtime
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl unzip libxml2

      - name: SwiftLint (strict)
        env:
          SWIFTLINT_VERSION: 0.65.1
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 5 --retry-delay 2 \
            --connect-timeout 20 --max-time 180 --output swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          unzip -o -q swiftlint.zip
          chmod +x swiftlint
          ./swiftlint version
          ./swiftlint lint --strict --reporter github-actions-logging

      - name: SwiftFormat (lint)
        env:
          SWIFTFORMAT_VERSION: 0.62.1
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 5 --retry-delay 2 \
            --connect-timeout 20 --max-time 180 --output swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          # The Linux zip unpacks a binary named `swiftformat_linux` (the macOS
          # zip used `swiftformat`).
          unzip -o -q swiftformat.zip
          chmod +x swiftformat_linux
          ./swiftformat_linux --version
          ./swiftformat_linux . --lint --config .swiftformat --reporter github-actions-log

  swift-package-tests:
    name: Standalone Swift package tests
    runs-on: ubuntu-latest
    container: swift:6.4
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run discovered package tests
        run: |
          set -euo pipefail
          mapfile -t packages < <(find . \
            -name Package.swift \
            -not -path './.git/*' \
            -not -path './DerivedData*/*' \
            -print)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No standalone Swift packages to test."
            exit 0
          fi
          for manifest in "${packages[@]}"; do
            package_dir="$(dirname "$manifest")"
            echo "::group::swift test ${package_dir}"
            swift test --package-path "$package_dir"
            echo "::endgroup::"
          done

  pr-build:
    name: Compile macOS app
    if: github.event_name == 'pull_request'
    needs: [swift-lint, swift-package-tests]
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The analyzer ratchets unused imports in files changed by this commit.
          fetch-depth: 2

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version

      - name: Build Debug
        run: |
          set -euo pipefail
          # SwiftLint needs the unsuppressed compiler invocations. The wrapper
          # keeps them in the log without flooding the Actions console.
          scripts/run-xcodebuild.sh PRBuild.log build \
            -showBuildTimingSummary \
            -project rankbuddy-macos.xcodeproj \
            -scheme rankbuddy-macos \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData-PR \
            -resultBundlePath PRBuild.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Install SwiftLint analyzer
        env:
          SWIFTLINT_VERSION: 0.65.1
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 5 --retry-delay 2 \
            --connect-timeout 20 --max-time 180 --output swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o -q swiftlint.zip
          chmod +x swiftlint
          ./swiftlint version

      - name: SwiftLint analyzer rules
        run: |
          set -euo pipefail
          SWIFTLINT_BIN="$PWD/swiftlint" \
            scripts/run-swiftlint-analyzer.sh PRBuild.log

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-build-diagnostics
          path: |
            PRBuild.log
            PRBuild.xcresult
          if-no-files-found: warn
          retention-days: 14

  full-tests:
    name: Full tests
    # The full macOS test lane is expensive (10x-billed minutes), so it stays
    # nightly/manual only — push and pull_request events skip it and rely on the
    # cheap gates above. `needs` makes it wait for the style gate so a nightly run
    # fails fast on style before paying for the compile.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [swift-lint, swift-package-tests]
    # xcode-27 is the supported runtime/toolchain image for this app target. Add a
    # separate minimum-runtime row when GitHub hosts an older supported image that
    # can run this Xcode/project combination, without sharing DerivedData.
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin an explicit Xcode rather than the image default, which drifts as Apple
      # ships updates. 27.0 is the stable compiler on the xcode-27 image.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version

      - name: Show schemes
        run: xcodebuild -list -project rankbuddy-macos.xcodeproj

      - name: Test Full plan
        run: |
          set -euo pipefail
          scripts/run-xcodebuild.sh FullTests.log test \
            -quiet \
            -showBuildTimingSummary \
            -project rankbuddy-macos.xcodeproj \
            -scheme rankbuddy-macos \
            -testPlan Full \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData-Full \
            -resultBundlePath Full.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Full test result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-tests-xcresult
          path: |
            Full.xcresult
            FullTests.log
          if-no-files-found: ignore

  release-build:
    name: Release build
    # Release catches optimization-only compiler and type-check-budget failures
    # without also paying for a second test run.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [swift-lint, swift-package-tests]
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version

      - name: Build Release
        run: |
          set -euo pipefail
          scripts/run-xcodebuild.sh ReleaseBuild.log build \
            -quiet \
            -showBuildTimingSummary \
            -project rankbuddy-macos.xcodeproj \
            -scheme rankbuddy-macos \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData-Release \
            -resultBundlePath Release.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Release build result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-xcresult
          path: |
            Release.xcresult
            ReleaseBuild.log
          if-no-files-found: ignore

  tsan-tests:
    name: TSan tests
    # TSan is intentionally manual-only; it is useful before releases and
    # concurrency-heavy changes, but too expensive for every nightly run.
    if: github.event_name == 'workflow_dispatch'
    needs: [swift-lint, swift-package-tests]
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version

      - name: Test TSan plan
        run: |
          set -euo pipefail
          scripts/run-xcodebuild.sh TSanTests.log test \
            -quiet \
            -showBuildTimingSummary \
            -project rankbuddy-macos.xcodeproj \
            -scheme rankbuddy-macos \
            -testPlan TSan \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData-TSan \
            -resultBundlePath TSan.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload TSan test result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tsan-tests-xcresult
          path: |
            TSan.xcresult
            TSanTests.log
          if-no-files-found: ignore

  # Dead-code detection (#21). Periphery compiles the app, so it stays on the
  # nightly/manual macOS lane like the build job. This is release-blocking: the
  # repository has a clean strict baseline, and unexplained production dead code
  # must be fixed or explicitly documented in the repository configuration.
  dead-code:
    name: Dead code
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: swift-lint
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version

      - name: Install Periphery
        env:
          PERIPHERY_VERSION: 3.8.0
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 5 --retry-delay 2 \
            --connect-timeout 20 --max-time 180 --output periphery.zip "https://github.com/peripheryapp/periphery/releases/download/${PERIPHERY_VERSION}/periphery-${PERIPHERY_VERSION}.zip"
          unzip -o -q periphery.zip
          chmod +x periphery
          ./periphery version

      - name: Scan for unused code
        run: ./periphery scan --strict --disable-update-check
