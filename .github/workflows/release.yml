name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version

      - name: Validate required secrets
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE CERTIFICATE_PASSWORD ASC_KEY ASC_KEY_ID ASC_ISSUER_ID \
            SPARKLE_PRIVATE_ED_KEY SPARKLE_PUBLIC_ED_KEY; do
            test -n "${!name}" || { echo "::error::$name is required"; exit 1; }
          done

      - name: Build Release app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          build="$(git rev-list --count HEAD)"
          scripts/validate-release-version.sh "$version" "$build" "$GITHUB_REF_NAME"
          scripts/run-xcodebuild.sh ReleaseBuild.log build \
            -quiet \
            -showBuildTimingSummary \
            -project rankbuddy-macos.xcodeproj \
            -scheme rankbuddy-macos \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData-Release \
            -resultBundlePath ReleaseBuild.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$build" \
            INFOPLIST_KEY_SUFeedURL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml" \
            INFOPLIST_KEY_SUPublicEDKey="$SPARKLE_PUBLIC_ED_KEY" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-diagnostics
          path: |
            ReleaseBuild.log
            ReleaseBuild.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Import signing certificate
        id: signing_certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c  # v7.2.0
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}

      - name: Resolve signing identity
        env:
          IDENTITIES: ${{ steps.signing_certificate.outputs.identities }}
        run: |
          set -euo pipefail
          identity="$(jq -ce '
            [.[] | select(.name | startswith("Developer ID Application:"))]
            | if length == 1 then .[0]
              else error("Expected exactly one Developer ID Application identity; found \(length)")
              end
          ' <<< "$IDENTITIES")"
          echo "SIGNING_IDENTITY=$(jq -r .hash <<< "$identity")" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY_NAME=$(jq -r .name <<< "$identity")" >> "$GITHUB_ENV"

      - name: Package and notarize
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          scripts/package-and-notarize.sh \
            DerivedData-Release/Build/Products/Release/rankbuddy-macos.app \
            "rankbuddy-${GITHUB_REF_NAME}.dmg"

      - name: Generate release notes
        run: scripts/release-notes.sh > RELEASE_NOTES.md

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: scripts/generate-appcast.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "rankbuddy-${GITHUB_REF_NAME}.dmg" \
            appcast.xml \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
