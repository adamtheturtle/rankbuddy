name: Website

on:
  push:
    paths:
      - ".github/workflows/website.yml"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "lychee.toml"
  pull_request:
    paths:
      - ".github/workflows/website.yml"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "lychee.toml"
  workflow_dispatch:

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.6.0"
          cache: npm

      - name: Install website tooling
        run: npm ci

      - name: Validate HTML, CSS, Markdown, and links
        run: npm run lint
