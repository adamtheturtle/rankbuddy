version: 2
updates:
  # Keep the actions used in workflows (actions/checkout, actions/cache,
  # actions/upload-artifact, …) up to date. Dependabot opens a PR when a new
  # version ships, including security fixes. No CI runner cost.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # One PR per week for all actions bumps rather than one PR per action, to
      # avoid unnecessary churn.
      github-actions:
        patterns:
          - "*"

  # SwiftPM updates use scripts/bump-swift-package.sh instead of Dependabot.
  # Resolving this Xcode graph requires the private buddy-kit repository, while
  # Dependabot cannot use the Actions deploy key. See docs/dependencies.md.
